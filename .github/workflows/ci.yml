name: CI/CD Pipeline - DevSecOps Quality & Security Audit

on:
  push:
    branches: [ main, test, ops, dev, sec ]
  pull_request:
    branches: [ main, test, ops, dev, sec ]

jobs:
  quality-and-security:
    name: Quality, Security Audit & Automated Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MOCK_MODEL: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Code Formatting Check (black & isort)
        continue-on-error: true
        run: |
          black --check .
          isort --check .

      - name: Dependency Vulnerability & Security Audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit --desc || true

      - name: Execute Automated Unit & Integration Tests (pytest)
        run: |
          python -m pytest tests/ --disable-warnings -v

  build-container:
    name: Build Docker Containers
    needs: quality-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Inference Service Docker Image
        run: |
          docker build -t inference_service:latest -f inference_service/Dockerfile .

      - name: Build Bot Docker Image
        run: |
          docker build -t bot:latest -f bot/Dockerfile .
