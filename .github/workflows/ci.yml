name: CI/CD Pipeline - DevSecOps Quality & Security Audit

on:
  push:
    branches: [ main, ops, dev ]
  pull_request:
    branches: [ main, ops, dev ]

jobs:
  quality-and-security:
    name: Quality, Security Audit & Automated Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MOCK_MODEL: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Code Formatting Check (black & isort)
        continue-on-error: true
        run: |
          black --check .
          isort --check .

      - name: Dependency Vulnerability & Security Audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit --desc

      - name: Execute Automated Unit & Integration Tests (pytest)
        run: |
          python -m pytest tests/test_ops.py --disable-warnings -v

  build-container:
    name: Build Docker Containers
    needs: quality-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Inference Service Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: inference_service/Dockerfile
          push: false
          tags: inference_service:latest

      - name: Build Bot Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: bot/Dockerfile
          push: false
          tags: bot:latest
